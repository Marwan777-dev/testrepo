<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nabadat</title>
    <script>
      /* No-flash tenant theme: apply the last-known tenant CSS synchronously,
         before the app bundle loads, so repeat visits never flash the default. */
      (function () {
        try {
          var css = localStorage.getItem("tenant-theme-css");
          if (css) {
            var s = document.createElement("style");
            s.id = "tenant-theme";
            s.textContent = css;
            document.head.appendChild(s);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
